      ${g ? `<span class="mini">🔥 ${g.streak}</span><span class="mini">⭐ ${g.level}</span>` : ''}<span class="muted" style="font-size:22px">›</span></div>`;
  }

  function viewToday() {
    const all = S.friends.filter(f => f.$.tier);
    const msg = all.filter(f => f.$.needsMessage).sort((a, b) => b.$.priority - a.$.priority);
    const book = all.filter(f => f.$.needsBooking).sort((a, b) => b.$.priority - a.$.priority);
    const booked = S.friends.filter(f => f.$.booked).sort((a, b) => (a.$.planDays ?? 999) - (b.$.planDays ?? 999));
    const bdays = S.friends.filter(f => f.$.bday && f.$.bday.days > 0 && f.$.bday.days <= 14).sort((a, b) => a.$.bday.days - b.$.bday.days);
    const picks = todaysPicks();
    const base = currentBase();

    let h = `<div class="hello"><h2>${greeting()}</h2>
      <button class="chip" style="margin-top:8px" data-act="bases">🏠 ${base ? esc(base.name) : 'Where are you living?'} <span class="n">▾</span></button></div>`;
    if (S.data.version !== CLIENT_VERSION) h += `<div class="banner" style="background:color-mix(in srgb, var(--bad) 14%, transparent)">
      <b>⚠️ Code.gs and Index.html don’t match.</b><div class="small">Paste the latest version of both files into Apps Script, then Deploy → Manage deployments → ✏️ → New version.</div></div>`;
    h += scoreRow();

    h += `<div class="section-title" style="margin-top:6px">✨ Today’s ${picks.length > 1 ? picks.length + ' people' : 'person'}</div>`;
    if (!picks.length) h += emptyState('🌈', 'Nobody needs you today', 'Everyone’s up to date. Enjoy it!');
    picks.forEach(f => {
      h += `<div class="pick"><div class="row" data-open="${f._row}" style="cursor:pointer">${avatar(f)}
          <div class="grow" style="min-width:0"><div class="name">${esc(f.name)}</div><div class="why">${pickReason(f)}</div></div></div>
        <div class="btns">
          <button class="btn primary" data-act="log" data-type="message" data-row="${f._row}">💬 Messaged</button>
          <button class="btn" data-act="log" data-type="meet" data-row="${f._row}" title="Saw them">🤝 Saw</button>
          <button class="btn" data-act="book" data-row="${f._row}" title="Make a plan">📅 Plan</button>
          <button class="btn" data-act="snooze" data-row="${f._row}" title="Not today">💤 Later</button></div></div>`;
    });
    h += `<button class="btn block" style="margin:4px 0 6px;padding:13px" data-act="quick">⚡ Log catch-ups</button>`;

    const checks = checkIns();
    if (checks.length) {
      const shown = S.showAllChecks ? checks : checks.slice(0, 3);
      h += `<div class="section-title">✅ Quick check-ins <span class="count">${checks.length}</span></div>
        <div class="box" style="padding:4px 14px">${shown.join('')}
        ${checks.length > shown.length ? `<button class="btn block" style="margin:6px 0 10px;padding:8px" data-act="more-checks">Show ${checks.length - shown.length} more</button>` : ''}</div>`;
    }

    if (bdays.length) {
      h += `<div class="section-title">🎂 Birthdays coming up</div><div class="scroll-x">${bdays.map(f => `
        <div class="bday-pill" data-open="${f._row}">${avatar(f)}<div class="name" style="font-size:15px">${esc(f.name.split(' ')[0])}</div>
        <div class="when">${inDays(f.$.bday.days)}</div>
        <div class="small muted">${f.$.bday.age ? 'turns ' + f.$.bday.age : fmtDate(f.$.bday.date)}</div></div>`).join('')}</div>`;
    }

    const F = S.todayFilter;
    h += `<div class="section-title">📋 Everyone who’s due</div><div class="seg">
      ${[['all', 'All'], ['message', '💬 Message'], ['book', '🤝 To see'], ['booked', '📅 Plans']].map(([k, label]) => {
        const n = k === 'message' ? msg.length : k === 'book' ? book.length : k === 'booked' ? booked.length : null;
        return `<button class="${F === k ? 'on' : ''}" data-act="today-filter" data-v="${k}">${label}${n ? `<span class="n">${n}</span>` : ''}</button>`;
      }).join('')}</div>`;
    let list;
    if (F === 'message') list = msg;
    else if (F === 'book') list = book;
    else if (F === 'booked') list = booked;
    else list = [...new Set([...msg, ...book])].sort((a, b) => b.$.priority - a.$.priority);
    if (!list.length) {
      h += F === 'booked' ? emptyState('🗓️', 'No plans yet', 'Tap 📅 on a friend when you’ve got something in the diary, whoever arranged it.')
        : emptyState('🌈', 'All caught up!', 'Nobody is overdue. Go enjoy your day.');
    } else {
      const shown = S.showAllDue ? list : list.slice(0, 8);
      h += shown.map(card).join('');
      if (list.length > shown.length) h += `<button class="btn block" data-act="more-due">Show all ${list.length}</button>`;
    }
    return h;
  }


  // Search understands plain words plus tag:, place:, tier:, met:, prox:, gift:, is:
  function matches(f, q) {
    const tokens = [];
    const free = q.replace(/(\w+):(?:"([^"]*)"|(\S+))/g, (_, k, a, b) => { tokens.push([k.toLowerCase(), (a ?? b).toLowerCase()]); return ' '; });
    for (const [k, v] of tokens) {
      const ok = {
        tag: () => f.$.tags.some(t => t.toLowerCase() === v || t.toLowerCase().includes(v)),
        place: () => f.$.places.some(t => t.toLowerCase().includes(v)),
        tier: () => String(f.$.tier) === v,
        met: () => String(f.meeting || '').toLowerCase().includes(v),
        prox: () => String(f.$.prox) === v,
        gift: () => String(f.gifteffort || '').toLowerCase().includes(v),
        is: () => ({
          due: f.$.needsMessage, book: f.$.needsBooking, booked: f.$.booked,
          christmas: isYes(f.christmascard) || isYes(f.christmasgifteffort),
          birthday: !!f.$.bday, untiered: !f.$.tier, ideas: !!String(f.futuregiftideas || '').trim()
        })[v]
      }[k];
      if (ok ? !ok() : !f.$.hay.includes(v)) return false;
    }
    return free.toLowerCase().split(/\s+/).filter(Boolean).every(w => f.$.hay.includes(w));
  }

  const SORTS = {
    priority: ['Who needs me most', (a, b) => b.$.priority - a.$.priority],
    health: ['Health (lowest first)', (a, b) => (a.$.health ?? 999) - (b.$.health ?? 999)],
    tier: ['Tier', (a, b) => (a.$.tier || 9) - (b.$.tier || 9) || a.name.localeCompare(b.name)],
    name: ['Name A–Z', (a, b) => a.name.localeCompare(b.name)],
    contacted: ['Longest since contact', (a, b) => (b.$.dContact ?? 1e6) - (a.$.dContact ?? 1e6)],
    seen: ['Longest since seen', (a, b) => (b.$.dSeenEff ?? 1e6) - (a.$.dSeenEff ?? 1e6)],
    birthday: ['Next birthday', (a, b) => (a.$.bday ? a.$.bday.days : 999) - (b.$.bday ? b.$.bday.days : 999)]
  };
  const STATUS = [['due', '💬 Message due'], ['book', '🤝 Due a meet-up'], ['booked', '📅 Has a plan'], ['christmas', '🎄 Christmas list'], ['ideas', '🎁 Has gift ideas'], ['untiered', '❔ No tier']];

  function filteredFriends() {
    let list = S.friends.filter(f => matches(f, S.query));
    if (S.tiers.size) list = list.filter(f => S.tiers.has(f.$.tier));
    if (S.status) list = list.filter(f => matches(f, 'is:' + S.status));
    return list.sort(SORTS[S.sort][1]);
  }

  function viewFriends() {
    const list = filteredFriends();
    const tierCounts = {};
    S.friends.forEach(f => { tierCounts[f.$.tier] = (tierCounts[f.$.tier] || 0) + 1; });
    return `
      <div class="search"><span class="mag">🔎</span>
        <input class="input" id="searchInput" type="search" placeholder="Search anything… try tag:climbing" value="${esc(S.query)}" autocomplete="off">
      </div>
      <div class="scroll-x">
        <button class="chip" data-act="add">🌱 Add friend</button>
        <button class="chip" data-act="browse">🏷️ All tags & search terms</button>
        ${[1, 2, 3, 4, 5, 6].filter(t => tierCounts[t]).map(t => `<button class="chip ${S.tiers.has(t) ? 'on' : ''}" data-act="tier-filter" data-v="${t}">
          <span class="tier-dot" style="background:${S.tiers.has(t) ? 'currentColor' : tierColor(t)}"></span>Tier ${t}${tierRule(t).label ? ' · ' + esc(tierRule(t).label) : ''} <span class="n">${tierCounts[t]}</span></button>`).join('')}
      </div>
      <div class="scroll-x">
        ${STATUS.map(([k, label]) => `<button class="chip ${S.status === k ? 'on' : ''}" data-act="status-filter" data-v="${k}">${label}</button>`).join('')}
      </div>
      <div class="row" style="margin:8px 2px 12px">
        <div class="grow muted small" style="font-weight:800">${plural(list.length, 'friend')}${S.query || S.tiers.size || S.status ? ` · <a href="#" data-act="clear-filters">clear filters</a>` : ''}</div>
        <select class="input" style="width:auto;padding:8px 12px;font-size:14px;font-weight:700" id="sortSelect" aria-label="Sort">
          ${Object.entries(SORTS).map(([k, [label]]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>↕ ${label}</option>`).join('')}
        </select>
      </div>
      <div id="friendList">${list.length ? list.map(card).join('') : emptyState('🔍', 'No matches', 'Try a different word, or tap 🏷️ to see every tag.')}</div>`;
  }

  function miniRow(f, extra = '') {
    const $f = f.$;
    const why = $f.booked ? `📅 ${esc(f.nextplan || 'Plan')}` : $f.recentlyInvited ? `💌 invited ${ago($f.dInvited)}`
      : $f.dSeenEff == null ? 'no meet-up logged' : `seen ${ago($f.dSeen ?? $f.dSeenEff)}`;
    return `<div class="list-row" data-open="${f._row}">${avatar(f, 'sm')}
      <div class="grow"><div class="name" style="font-size:16px">${esc(f.name)}</div>
        <div class="sub">${tierBadge(f)} · <span style="color:${$f.needsBooking ? 'var(--bad)' : 'inherit'}">${why}</span></div>${extra}</div>
      <button class="act ${$f.booked ? 'on' : ''}" style="padding:8px 10px" data-act="book" data-row="${f._row}"><span class="e">📅</span></button></div>`;
  }

  function viewPlaces() {
    const keys = placeKeys();
    let h = `<div class="hello"><h2>📍 Places</h2><p>Who to see in each place, most overdue first.</p>
      <button class="chip" style="margin-top:10px" data-tab="map">🗺️ Map</button>
      <button class="chip" style="margin-top:10px" data-act="bases">🏠 ${currentBase() ? 'Living in ' + esc(currentBase().name) : 'Add your home bases'} <span class="n">▾</span></button></div>`;
    if (!keys.length) return h + emptyState('🧭', 'No places yet', 'Add place tags to friends, or add a home base.');
    keys.forEach(p => {
      const members = placeMembers(p.key).filter(f => f.$.tier).sort(seeRank);
      if (!members.length && !p.base) return;
      const due = members.filter(f => f.$.needsBooking).length;
      const open = S.openPlaces.has(p.key);
      const shown = open ? members : members.slice(0, 5);
      h += `<div class="section-title" style="margin-bottom:2px">${p.base ? '🏠' : '📍'} ${esc(p.label)}${p.current ? ' <span class="chip tiny" style="background:var(--accent);color:var(--accent-ink)">home now</span>' : ''}
          <button class="chip tiny" style="margin-left:auto" data-act="invite" data-v="${esc(p.key)}">💌 Invite</button></div>
        <div class="small muted" style="margin:0 4px 10px;font-weight:700">${plural(members.length, 'friend')}${p.base ? ` within ${NEAR_KM} km` : ''}${due ? ` · <span style="color:var(--bad)">${due} to see</span>` : ''}</div>
        ${shown.map(f => miniRow(f)).join('') || `<p class="muted small" style="margin:0 4px">Nobody within ${NEAR_KM} km yet.</p>`}
        ${members.length > 5 ? `<button class="btn block" style="padding:8px" data-act="toggle-place" data-v="${esc(p.key)}">${open ? 'Show fewer' : `Show all ${members.length}`}</button>` : ''}`;
    });
    return h;
  }

  function viewDates() {
    let h = `<div class="seg">
      <button class="${S.datesView === 'birthdays' ? 'on' : ''}" data-act="dates-view" data-v="birthdays">🎂 Birthdays</button>
      <button class="${S.datesView === 'christmas' ? 'on' : ''}" data-act="dates-view" data-v="christmas">🎄 Christmas</button></div>`;
    if (S.datesView === 'birthdays') {
      const list = S.friends.filter(f => f.$.bday).sort((a, b) => a.$.bday.days - b.$.bday.days);
      const missing = S.friends.length - list.length;
      let month = '';
      h += list.map(f => {
        const b = f.$.bday;
        const m = b.date.toLocaleDateString('en-GB', { month: 'long', year: b.date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
        const head = m !== month ? `<div class="month">${m}</div>` : '';
        month = m;
        return head + `<div class="list-row" data-open="${f._row}">${avatar(f, 'sm')}
          <div class="grow"><div class="name" style="font-size:16px">${esc(f.name)}</div>
            <div class="sub">${fmtDate(b.date)}${b.age ? ' · turns ' + b.age : ''}${f.gifteffort ? ' · 🎁 ' + esc(f.gifteffort) : ''}</div>
            ${f.futuregiftideas ? `<div class="small muted" style="margin-top:2px">💡 ${esc(f.futuregiftideas)}</div>` : ''}</div>
          <div class="meta" style="color:${b.days <= 14 ? 'var(--t1)' : 'var(--muted)'}">${b.days === 0 ? 'Today 🎉' : inDays(b.days)}</div></div>`;
      }).join('');
      if (!list.length) h += emptyState('🎂', 'No birthdays yet', 'Add birthdays from a friend’s page.');
      if (missing) h += `<p class="muted small" style="text-align:center;margin-top:18px">${plural(missing, 'friend')} without a birthday saved.</p>`;
    } else {
      const list = S.friends.filter(f => isYes(f.christmascard) || isYes(f.christmasgifteffort))
        .sort((a, b) => (a.$.tier || 9) - (b.$.tier || 9) || a.name.localeCompare(b.name));
      const cards = list.filter(f => isYes(f.christmascard)).length;
      const gifts = list.filter(f => isYes(f.christmasgifteffort)).length;
      const noAddr = list.filter(f => isYes(f.christmascard) && !postalAddress(f)).length;
      h += `<div class="box">
        <div class="row"><div class="grow"><h3 style="margin:0">📬 Email me this list on 25 November</h3>
          <div class="small muted">Plus a Monday nudge with birthdays and who to invite. Goes to ${esc(S.data.email || 'you')}.</div></div>
          <button class="switch ${S.data.remindersOn ? 'on' : ''}" data-act="reminders" aria-label="Toggle reminders"></button></div>
        <div class="row" style="margin-top:12px">
          <button class="btn grow" data-act="email-xmas">📧 Email it now</button>
          <button class="btn grow" data-act="copy-addresses">📋 Copy addresses</button></div>
      </div>
      <div class="section-title">💌 ${plural(cards, 'card')} · 🎁 ${plural(gifts, 'gift')}${noAddr ? ` <span class="count" style="color:var(--bad)">${noAddr} missing an address</span>` : ''}</div>`;
      h += list.map(f => `<div class="list-row" data-open="${f._row}" style="align-items:flex-start">${avatar(f, 'sm')}
        <div class="grow"><div class="name" style="font-size:16px">${esc(f.name)}</div>
          <div class="small" style="white-space:pre-line">${postalAddress(f) ? esc(postalAddress(f)) : '<span style="color:var(--bad)">No address yet</span>'}</div>
          ${f.futuregiftideas ? `<div class="small muted">💡 ${esc(f.futuregiftideas)}</div>` : ''}
</div>
        <div class="meta">${isYes(f.christmascard) ? '💌' : ''}${isYes(f.christmasgifteffort) ? `<div class="small muted">🎁 ${esc(f.christmasgifteffort)}</div>` : ''}</div></div>`).join('');
      if (!list.length) h += emptyState('🎄', 'Nobody on the list yet', 'Turn on “Christmas card” on a friend’s page.');
    }
    return h;
  }

  /* ───────────── Bottom sheets ───────────── */
  function openSheet(kind, extra = {}) { S.sheet = Object.assign({ kind }, extra); $('#sheet').hidden = false; renderSheet(); $('#sheetPanel').scrollTop = 0; }
  function closeSheet() { S.sheet = null; $('#sheet').hidden = true; $('#sheetPanel').innerHTML = ''; }
  function rerenderSheet() {
    if (!S.sheet || S.sheet.kind !== 'friend') return;
    const panel = $('#sheetPanel'), top = panel.scrollTop;
    renderSheet(); panel.scrollTop = top;
  }
  function renderSheet() {
    if (!S.sheet) return;
    const k = S.sheet.kind;
    const html = k === 'friend' ? sheetFriend() : k === 'book' ? sheetBook() : k === 'add' ? sheetAdd()
      : k === 'progress' ? sheetProgress() : k === 'quick' ? sheetQuick() : k === 'browse' ? sheetBrowse() : k === 'settings' ? sheetSettings() : k === 'bases' ? sheetBases() : k === 'invite' ? sheetInvite() : '';
    if (!html) return closeSheet();
    $('#sheetPanel').innerHTML = `<button class="close" data-act="close" aria-label="Close">✕</button><div class="grabber"></div>` + html;
  }

  const editable = key => !(S.cols[key] && S.cols[key].computed);
  function fieldInput(f, key, label, opts = {}) {
    if (!editable(key)) return `<div class="field"><span>${esc(label)} 🔒</span><div class="input" style="opacity:.75">${esc(f[key]) || '—'}</div></div>`;
    const v = f[key] ?? '';
    const common = `class="input" data-save="${key}" data-row="${f._row}"`;
    let input;
    if (opts.type === 'textarea') input = `<textarea ${common} placeholder="${esc(opts.placeholder || '')}">${esc(v)}</textarea>`;
    else if (opts.type === 'date') { const d = parseDate(v); input = `<input type="date" ${common} value="${d && !d.noYear ? iso(d) : ''}">`; }
    else input = `<input ${common} value="${esc(v)}" placeholder="${esc(opts.placeholder || '')}" ${opts.list ? `list="${opts.list}"` : ''}>`;
    return `<label class="field"><span>${esc(label)}</span>${input}</label>`;
  }

  function allValues(key, splitter = splitTags) {
    const counts = {};
    S.friends.forEach(f => splitter(f[key]).forEach(t => { const k = t.toLowerCase(); counts[k] = counts[k] || { label: t, n: 0 }; counts[k].n++; }));
    return Object.values(counts).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
  }
  const single = v => String(v || '').trim() ? [String(v).trim()] : [];

  function tagEditor(f, key, label, emoji) {
    if (!editable(key)) return '';
    const tags = splitTags(f[key]);
    const listId = 'dl-' + key;
    return `<div class="field"><span>${emoji} ${label}</span><div class="tag-edit">
      ${tags.map((t, i) => `<span class="chip tiny">${esc(t)}<button class="x" data-act="tag-remove" data-key="${key}" data-row="${f._row}" data-i="${i}" aria-label="Remove ${esc(t)}">✕</button></span>`).join('')}
      <input placeholder="+ add" list="${listId}" data-tag-add="${key}" data-row="${f._row}" enterkeyhint="done">
      <datalist id="${listId}">${allValues(key).filter(v => !tags.some(t => t.toLowerCase() === v.label.toLowerCase())).map(v => `<option value="${esc(v.label)}">`).join('')}</datalist>
    </div></div>`;
  }

  function sheetFriend() {
    const f = S.byRow[S.sheet.row];
    if (!f) return '';
    const $f = f.$;
    const phone = String(f.phone || '').replace(/[^\d+]/g, '');
    const addr = postalAddress(f);
    const tiers = [1, 2, 3, 4, 5, 6];
    const proxOpts = [1, 2, 3, 4, 5, 6].map(p => `<option value="${p}" ${$f.prox === p ? 'selected' : ''}>${p} · ${esc(proxRule(p).geography || 'Proximity ' + p)}</option>`).join('');
    const sheetLink = S.data.sheetUrl + '&range=A' + f._row;

    return `
      <div class="sheet-head">${avatar(f, 'lg')}
        <div class="grow"><h2>${esc(f.name)}</h2><div class="sub">${tierBadge(f)}</div>
        ${f.meeting ? `<div class="small muted">🤝 ${esc(f.meeting)}</div>` : ''}</div>
        ${ring($f.health, 64)}</div>

      <div class="actions" style="margin:0 0 12px;grid-template-columns:repeat(4,1fr)">
        <button class="act" data-act="log" data-type="message" data-row="${f._row}"><span class="e">💬</span>Messaged</button>
        <button class="act" data-act="log" data-type="call" data-row="${f._row}"><span class="e">📞</span>Called</button>
        <button class="act" data-act="log" data-type="video" data-row="${f._row}"><span class="e">🎥</span>Video</button>
        <button class="act" data-act="log" data-type="meet" data-row="${f._row}"><span class="e">🤝</span>Saw</button>
        <button class="act" data-act="log" data-type="reached" data-row="${f._row}"><span class="e">📥</span>They got in touch</button>
        <button class="act" data-act="log" data-type="invite" data-row="${f._row}"><span class="e">💌</span>I invited them</button>
        <button class="act ${$f.booked ? 'on' : ''}" data-act="book" data-row="${f._row}"><span class="e">📅</span>${$f.booked ? 'Plan ✓' : 'Plan'}</button>
      </div>
      ${phone ? `<div class="links" style="margin-bottom:12px">
        <a class="btn grow" href="sms:${esc(phone)}">💬 Text</a>
        <a class="btn grow" href="tel:${esc(phone)}">📞 Ring</a></div>` : ''}

      ${$f.hasPlan ? `<div class="box"><h3>${$f.planPast ? '❓ Did this happen?' : '📅 Plan'}</h3>
        <div class="row"><div class="grow"><b>${esc(f.nextplan || 'Plan')}</b><div class="small muted">${$f.planDate ? fmtDate($f.planDate) + ' · ' + inDays($f.planDays) : 'No date yet'}</div></div>
          </div>
        <div class="row" style="margin-top:10px">
          ${$f.planDays != null && $f.planDays > 0
            ? `<button class="btn grow" style="padding:8px 10px" data-act="book" data-row="${f._row}">✏️ Edit</button>`
            : `<button class="btn primary grow" style="padding:8px 10px" data-act="plan-yes" data-row="${f._row}">It happened 🎉</button>`}
          <button class="btn grow" style="padding:8px 10px" data-act="plan-they" data-row="${f._row}">They cancelled</button>
          <button class="btn grow" style="padding:8px 10px" data-act="plan-me" data-row="${f._row}">I cancelled</button></div></div>` : ''}
      ${$f.rel.pendingInvite ? `<div class="box"><h3>💌 Invited ${ago(daysSince($f.rel.pendingInvite.date))}: any reply?</h3><div class="row">
          <button class="btn primary grow" style="padding:8px" data-act="inv-reply" data-v="yes" data-row="${f._row}">📅 Made a plan</button>
          <button class="btn grow" style="padding:8px" data-act="inv-reply" data-v="declined" data-row="${f._row}">🙂 Said no</button>
          <button class="btn grow" style="padding:8px" data-act="inv-reply" data-v="noreply" data-row="${f._row}">👻 No reply</button></div></div>` : ''}

      <div class="box"><h3>💗 Friendship health</h3>
        ${$f.tier ? `
        <div class="kv"><span>🔋 Friendship battery</span><b>${$f.health}%${$f.booked && $f.bat.total < PLAN_FLOOR ? ' <span class="muted small">(plan in the diary)</span>' : ''}</b></div>
        <div class="bar" style="display:flex;gap:2px;background:var(--surface-2)">
          <i style="width:${Math.round($f.bat.inPerson)}%;background:var(--good)" title="In person"></i>
          <i style="width:${Math.round($f.bat.topUp)}%;background:var(--t5)" title="Calls, video & messages"></i></div>
        <div class="small muted"><span style="color:var(--good)">■</span> in person ${Math.round($f.bat.inPerson)} · <span style="color:var(--t5)">■</span> calls, video & messages +${Math.round($f.bat.topUp)}</div>
        <div class="kv" style="margin-top:10px"><span>🤝 Seen <span class="muted">· aim ${every($f.seeGoal)}</span></span><b>${ago($f.dSeen)}</b></div>
        <div class="kv"><span>💬 In touch <span class="muted">· aim ${every($f.contactGoal)}</span></span><b>${ago($f.dContact)}</b></div>
        ${$f.dCall != null ? `<div class="kv"><span>📞 Last call or video</span><b>${ago($f.dCall)}</b></div>` : ''}
        ` : `<div class="small muted">Pick a tier below to start tracking this friendship.</div>`}
        ${$f.km != null ? `<div class="small" style="margin-top:10px">📍 About ${$f.km < 1 ? '<1' : Math.round($f.km)} km from ${esc(currentBase().name)} → <b>${esc(proxRule(distanceBand($f.km, currentBase(), $f.loc)).geography || 'band ' + distanceBand($f.km, currentBase(), $f.loc))}</b>${$f.proxAuto ? '' : ' <span class="muted">(auto distance is off)</span>'}</div>` : ''}
        <div class="field" style="margin:14px 0 8px"><span>Tier</span><div class="tier-pick">
          ${tiers.map(t => `<button class="${$f.tier === t ? 'on' : ''}" style="${$f.tier === t ? 'background:' + tierColor(t) : ''}" data-act="set-tier" data-row="${f._row}" data-v="${t}" ${editable('tier') ? '' : 'disabled'}>${t}</button>`).join('')}
        </div></div>
        <label class="field" style="margin:0"><span>${$f.proxAuto ? 'Distance in sheet (used when auto is off)' : 'How far away'}</span>
          <select class="input" data-save="proximityscore" data-row="${f._row}" ${editable('proximityscore') ? '' : 'disabled'}><option value="">–</option>${proxOpts}</select></label>
      </div>

      <details class="box fold" data-box="reliability" ${S.openBoxes.has('reliability') ? 'open' : ''}><summary><h3>🤝 Reliability</h3></summary>
        <div class="kv"><span>${reliabilityLabel($f.rel)}</span><b>${$f.rel.attempts >= RELIABILITY_MIN ? Math.round($f.rel.reliability * 100) + '%' : '–'}</b></div>
        ${$f.rel.attempts >= RELIABILITY_MIN ? `<div class="bar"><i style="width:${Math.round($f.rel.reliability * 100)}%;background:${healthColor($f.rel.reliability * 100)}"></i></div>` : ''}
        <div class="small muted" style="margin-top:6px">Plans kept ${$f.rel.kept} · said yes ${$f.rel.yes} · cancelled ${$f.rel.cancelled} · no reply ${$f.rel.ghosted} · said no ${$f.rel.declined}</div>
        <div class="small muted">Last 90 days: you messaged or invited ${$f.rel.mine90}×, they got in touch ${$f.rel.theirs90}× (tap 📥 when they do)</div>
        ${tierSuggestion(f) ? `<div class="row" style="margin-top:10px"><button class="btn primary grow" data-act="tier-move" data-v="${tierSuggestion(f).to}" data-row="${f._row}">${tierSuggestion(f).dir === 'down' ? '⬇️' : '⬆️'} Suggest: move to tier ${tierSuggestion(f).to}</button>
          <button class="btn" data-act="tier-keep" data-row="${f._row}">Keep</button></div>` : ''}
      </details>

      <details class="box fold" data-box="tags" ${S.openBoxes.has('tags') ? 'open' : ''}><summary><h3>🏷️ Tags</h3></summary>
        ${tagEditor(f, 'tags', 'Tags', '✨')}
        ${tagEditor(f, 'placetags', 'Places', '📍')}
      </details>

      <details class="box fold" data-box="birthdaygift" ${S.openBoxes.has('birthdaygift') ? 'open' : ''}><summary><h3>🎁 Birthday & gifts</h3></summary>
        ${$f.bday ? `<p class="small" style="margin:0 0 10px"><b>${fmtDate($f.bday.date)}</b> · ${inDays($f.bday.days)}${$f.bday.age ? ' · turns ' + $f.bday.age : ''}</p>` : ''}
        ${fieldInput(f, 'birthdaydate', 'Birthday', { type: 'date' })}
        ${fieldInput(f, 'gifteffort', 'Birthday gift effort', { placeholder: 'e.g. Card, Small, Big', list: 'dl-effort' })}
        ${fieldInput(f, 'futuregiftideas', 'Future gift ideas', { type: 'textarea', placeholder: 'They mentioned…' })}
        ${fieldInput(f, 'giftslastbrought', 'Gifts last bought', { type: 'textarea' })}
        <datalist id="dl-effort">${allValues('gifteffort', single).concat(allValues('christmasgifteffort', single)).map(v => `<option value="${esc(v.label)}">`).join('')}</datalist>
      </details>

      <details class="box fold" data-box="foodpreferen" ${S.openBoxes.has('foodpreferen') ? 'open' : ''}><summary><h3>🍽️ Food & preferences</h3></summary>
        ${fieldInput(f, 'allergydietaryrequirements', 'Allergies / dietary needs', { placeholder: 'e.g. vegetarian, nut allergy' })}
        ${fieldInput(f, 'likes', 'Likes', { type: 'textarea', placeholder: 'Spicy food, jazz, natural wine…' })}
        ${fieldInput(f, 'dislikes', 'Dislikes', { type: 'textarea', placeholder: 'Mushrooms, karaoke…' })}
      </details>

      <details class="box fold" data-box="christmas" ${S.openBoxes.has('christmas') ? 'open' : ''}><summary><h3>🎄 Christmas</h3></summary>
        <div class="row" style="margin-bottom:12px"><div class="grow"><b>Send a card</b></div>

  function sheetBook() {

    const d = f.$.planDate;
    const org = S.sheet.org || '';
    return `<div class="sheet-head">${avatar(f)}<div class="grow"><h2>📅 A plan with ${esc(f.name.split(' ')[0])}</h2><div class="sub">Whoever arranged it</div></div></div>

      <div class="scroll-x" style="margin:-4px 0 12px">${ideas.map(i => `<button class="chip" data-act="plan-idea" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>
      <label class="field"><span>When</span><input class="input" type="date" id="planDate" value="${d && !d.noYear ? iso(d) : ''}" min="${iso(today())}"></label>
      <div class="field"><span>Who organised it? (optional)</span><div class="row">
        ${[['them', '🙌 They did'], ['me', '🙋 I did'], ['other', '👥 Someone else']].map(([k, l]) => `<button class="chip grow ${org === k ? 'on' : ''}" style="justify-content:center" data-act="plan-org" data-v="${k}">${l}</button>`).join('')}</div>
        <div class="small muted" style="margin:6px 4px 0">If they invited you, it counts towards their reliability.</div></div>
      <button class="btn primary block" data-act="plan-save" data-row="${f._row}">Save plan ✅</button>
      ${f.$.hasPlan ? `<button class="btn block" style="margin-top:8px" data-act="plan-no" data-row="${f._row}">Remove plan</button>` : ''}`;
  }

  function sheetQuick() {
    const q = S.quick || (S.quick = { text: '', parsed: [], day: iso(today()), filter: '' });
    const recent = {};
    S.log.forEach(e => { if (CHANNEL[e.type] && e.date >= iso(addDays(today(), -90))) recent[e.name.toLowerCase()] = (recent[e.name.toLowerCase()] || 0) + 1; });
    const list = S.friends
      .filter(f => !q.filter || f.$.hay.includes(q.filter.toLowerCase()))
      .sort((a, b) => (b.$.planPast - a.$.planPast) || ((recent[b.name.toLowerCase()] || 0) - (recent[a.name.toLowerCase()] || 0)) || ((a.$.tier || 9) - (b.$.tier || 9)))
      .slice(0, 30);
    const days = [0, 1, 2, 3, 4, 5, 6].map(n => iso(addDays(today(), -n)));
    return `<div class="sheet-head"><div style="font-size:40px">⚡</div><div class="grow"><h2>Log catch-ups</h2><div class="sub">Type it like a text, or tap below</div></div></div>
      <textarea class="input" id="quickText" rows="3" placeholder="e.g. dinner with Sam and Jo on Saturday, called Mum yesterday, video with Chen">${esc(q.text)}</textarea>
      <div id="quickPreview">${quickPreview()}</div>
      <div class="section-title" style="margin-top:18px">Or tap people</div>
      <div class="scroll-x" style="margin-bottom:8px">${days.map(d => `<button class="chip ${q.day === d ? 'on' : ''}" data-act="quick-day" data-v="${d}">${dayLabel(d)}</button>`).join('')}</div>
      <input class="input" id="quickFilter" placeholder="Find someone…" value="${esc(q.filter)}" style="margin-bottom:10px" autocomplete="off">
      <div id="quickList">${list.map(f => `<div class="list-row" style="cursor:default">${avatar(f, 'sm')}
        <div class="grow" style="min-width:0"><div class="name" style="font-size:15px">${esc(f.name)}</div><div class="sub">${f.$.planPast ? '📅 ' + esc(f.nextplan || 'plan') : tierBadge(f)}</div></div>
        <div class="row" style="gap:4px">${['message', 'call', 'video', 'meet'].map(t => `<button class="act" style="padding:7px 6px" data-act="quick-tap" data-type="${t}" data-row="${f._row}" aria-label="${t}"><span class="e">${TYPE_EMOJI[t]}</span></button>`).join('')}</div></div>`).join('')}</div>
      <button class="btn block" style="margin-top:6px" data-act="add">🌱 Add someone new</button>`;
  }
  function quickPreview() {
    const q = S.quick;
    if (!q || !q.parsed.length) return q && q.text.trim() ? '<p class="small muted" style="margin:8px 4px">No friends’ names spotted yet.</p>' : '';
    return `<div class="tag-edit" style="margin:10px 0">${q.parsed.map((e, i) => {
      const f = e.cands[e.pick];
      return `<span class="chip" style="padding-right:6px">
        <button data-act="ql-type" data-i="${i}" title="Change type">${TYPE_EMOJI[e.type]}</button>
        <button data-act="ql-who" data-i="${i}" title="${e.cands.length > 1 ? 'Tap for the other ' + esc(f.name.split(' ')[0]) : ''}">${esc(f.name)}${e.cands.length > 1 ? ' ⇄' : ''}</button>
        <button class="muted small" data-act="ql-date" data-i="${i}" title="Change day">${dayLabel(e.date)}</button>
        <button class="x" data-act="ql-remove" data-i="${i}" aria-label="Remove">✕</button></span>`;
    }).join('')}</div>
    <button class="btn primary block" data-act="ql-save">Log ${plural(q.parsed.length, 'catch-up')}</button>
    <p class="small muted" style="margin:6px 4px 0">Tap the emoji to change the type, or the day to change the date. ⇄ means there’s more than one friend with that name.</p>`;
  }

      <div class="field"><span>Tier</span><div class="tier-pick">${[1, 2, 3, 4, 5, 6].map(t => `<button data-act="add-tier" data-v="${t}" class="${S.sheet.tier === t ? 'on' : ''}" style="${S.sheet.tier === t ? 'background:' + tierColor(t) : ''}">${t}</button>`).join('')}</div>

  function sheetBrowse() {
    const section = (title, key, items, hint) => items.length ? `<div class="box"><h3>${title}</h3>
      <div class="tag-edit">${items.map(v => `<button class="chip tiny" data-act="search-for" data-v="${esc(key + ':' + (/\s/.test(v.label) ? '"' + v.label + '"' : v.label))}">${esc(v.label)} <span class="n">${v.n}</span></button>`).join('')}</div>

    const tiers = [1, 2, 3, 4, 5, 6].map(t => ({ label: String(t), n: S.friends.filter(f => f.$.tier === t).length })).filter(x => x.n);
    const prox = [1, 2, 3, 4, 5, 6].map(p => ({ label: String(p), n: S.friends.filter(f => f.$.prox === p).length, geo: proxRule(p).geography })).filter(x => x.n);
    return `<div class="sheet-head"><div style="font-size:40px">🏷️</div><div class="grow"><h2>Tags & search terms</h2><div class="sub">Tap any of these to search</div></div></div>
      ${section('✨ Tags', 'tag', allValues('tags'), 'tag:climbing')}

      <div class="box"><h3>🧭 Distance</h3><div class="tag-edit">${prox.map(p => `<button class="chip tiny" data-act="search-for" data-v="prox:${p.label}">${p.label} · ${esc(p.geo || '')} <span class="n">${p.n}</span></button>`).join('')}</div></div>
      <div class="box help"><h3>🔎 Search tips</h3>
        <p>Type any word to search everything: names, notes, addresses, gift ideas.</p>
        <table>
          <tr><td><code>tag:climbing</code></td><td>has that tag</td></tr>
          <tr><td><code>place:bristol</code></td><td>place tag</td></tr>

          <tr><td><code>is:book</code></td><td>overdue a meet-up</td></tr>
          <tr><td><code>is:booked</code></td><td>has a plan</td></tr>
          <tr><td><code>is:christmas</code></td><td>on the Christmas list</td></tr>
          <tr><td><code>is:ideas</code></td><td>has gift ideas</td></tr>
          <tr><td><code>is:untiered</code></td><td>no tier yet</td></tr>
        </table>
        <p style="margin-top:8px">Mix them: <code>tag:uni place:london</code>. Use quotes for spaces: <code>tag:"board games"</code></p></div>`;
  }

  function sheetBases() {

          <button class="btn" style="padding:8px 12px" data-act="base-remove" data-v="${esc(b.name)}" aria-label="Remove ${esc(b.name)}">✕</button></div>`).join('')

        <table class="small" style="width:100%;margin-top:10px;border-collapse:collapse">

  function sheetInvite() {
    const st = S.sheet;
    const keys = placeKeys();
    if (!st.place) st.place = currentBase() ? 'base:' + currentBase().name : (keys[0] ? keys[0].key : 'all:');
    const list = inviteCandidates(st.place, st.tag);
    if (!st.picked) st.picked = new Set(list.slice(0, st.size).map(f => f._row));
    const foodish = /dinner|lunch|brunch|bbq|party|food|picnic/i.test(st.what);
    const tags = allValues('tags').slice(0, 30);
    return `<div class="sheet-head"><div style="font-size:40px">💌</div><div class="grow"><h2>Who to invite</h2><div class="sub">Overdue friends first, closest tiers first</div></div></div>
      <label class="field"><span>Where</span><select class="input" id="invPlace">
        ${keys.map(p => `<option value="${esc(p.key)}" ${st.place === p.key ? 'selected' : ''}>${p.base ? '🏠' : '📍'} ${esc(p.label)}</option>`).join('')}
        <option value="all:" ${st.place === 'all:' ? 'selected' : ''}>🌍 Anywhere</option></select></label>
      <div class="field"><span>What</span><div class="scroll-x">${['Coffee', 'Drinks', 'Dinner', 'Party', 'Walk', 'Day out'].map(w => `<button class="chip ${st.what === w ? 'on' : ''}" data-act="inv-what" data-v="${w}">${w}</button>`).join('')}</div></div>
      <div class="row" style="gap:10px">
        <label class="field grow"><span>How many</span><select class="input" id="invSize">${[2, 4, 6, 10, 20].map(n => `<option ${st.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field grow"><span>Only people tagged</span><select class="input" id="invTag"><option value="">Anyone</option>${tags.map(t => `<option ${st.tag === t.label ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label>
      </div>
      <div class="section-title" style="margin-top:4px">${st.picked.size} picked <span class="count">of ${plural(list.length, 'suggestion')}</span></div>
      ${list.length ? list.map(f => {
        const on = st.picked.has(f._row);
        const food = [f.allergydietaryrequirements && '⚠️ ' + esc(f.allergydietaryrequirements), foodish && f.dislikes && '👎 ' + esc(f.dislikes), f.likes && '❤️ ' + esc(f.likes)].filter(Boolean);
        return `<div class="list-row" data-act="inv-toggle" data-row="${f._row}" style="${on ? 'outline:2px solid var(--accent)' : 'opacity:.75'}">
          <div style="font-size:22px">${on ? '✅' : '⬜'}</div>${avatar(f, 'sm')}
          <div class="grow"><div class="name" style="font-size:16px">${esc(f.name)}</div>
            <div class="sub">${tierBadge(f)} · ${f.$.dSeenEff == null ? 'not seen yet' : 'seen ' + ago(f.$.dSeen ?? f.$.dSeenEff)}</div>
            ${food.length ? `<div class="small muted">${food.join(' · ')}</div>` : ''}</div></div>`;
      }).join('') : emptyState('🌈', 'Nobody to suggest', 'Everyone here is booked, recently invited or up to date.')}
      <div class="row" style="position:sticky;bottom:-28px;background:var(--bg);padding:12px 0">
        <button class="btn grow" data-act="inv-copy">📋 Copy names</button>
        <button class="btn primary grow" data-act="inv-done" ${st.picked.size ? '' : 'disabled'}>💌 Mark ${st.picked.size} invited</button></div>`;
  }

  function sheetSettings() {
    const rows = [1, 2, 3, 4, 5, 6].map(t => {
      const tr = tierRule(t);
      return `<tr><td><span class="tier-dot" style="background:${tierColor(t)}"></span> ${t}${tr.label ? ' · ' + esc(tr.label) : ''}</td><td>${every(tr.contactGoal)}</td><td>× ${tr.seeMultiplier}</td></tr>`;
    }).join('');
    const prox = [1, 2, 3, 4, 5, 6].map(p => `<tr><td>${p} · ${esc(proxRule(p).geography)}</td><td>${every(proxRule(p).inviteGoal)}</td></tr>`).join('');
    return `<div class="sheet-head"><div style="font-size:40px">⚙️</div><div class="grow"><h2>Settings</h2></div></div>
      <div class="box"><div class="row"><div class="grow"><b>📬 Reminder emails</b>

      <div class="box">
        <div class="row"><div class="grow"><b>🎮 Game bits</b><div class="small muted">XP, levels, streaks, quests and badges. Your friendship score stays either way.</div></div>
          <button class="switch ${gameOn() ? 'on' : ''}" data-act="game-toggle"></button></div>
        <div class="row" style="margin-top:12px"><div class="grow"><b>🤖 Assume plans happened</b><div class="small muted">${AUTO_CONFIRM_DAYS} days after a plan’s date it’s logged as a catch-up. Today shows them so you can say it didn’t happen.</div></div>
          <button class="switch ${S.prefs.autoConfirm !== false ? 'on' : ''}" data-act="auto-toggle"></button></div></div>
      <button class="btn block" style="margin-bottom:12px" data-act="progress">🏆 Progress, badges & reliability</button>
      <button class="btn block" style="margin-bottom:12px" data-act="bases">🏠 Home bases & distances</button>
      <a class="btn block" style="margin-bottom:12px" href="${esc(S.data.sheetUrl)}" target="_blank" rel="noopener">📄 Open my spreadsheet</a>
      <div class="box help"><h3>💗 How health works</h3>
        <p><b>🔋 Health is a friendship battery.</b> Every catch-up tops it up and it slowly drains, so seeing someone often counts for more than seeing them once.</p>
        <table><tr><th>Catch-up</th><th>Adds</th><th>On its own, fills up to</th></tr>
          <tr><td>🤝 In person</td><td>${BATTERY.points.meet}</td><td>100%</td></tr>
          <tr><td>🎥 Video</td><td>${BATTERY.points.video}</td><td>${BATTERY.caps.video}% (${BATTERY.capsFar.video}% if far away)</td></tr>
          <tr><td>📞 Call</td><td>${BATTERY.points.call}</td><td>${BATTERY.caps.call}% (${BATTERY.capsFar.call}% if far away)</td></tr>
          <tr><td>💬 Message, 📥 they got in touch</td><td>${BATTERY.points.message}</td><td>${BATTERY.caps.message}%</td></tr></table>
        <p style="margin-top:8px"><b>Together:</b> calls, video and messages top up whatever in-person time hasn’t filled. A call doesn’t replace seeing someone, but it keeps things warm.</p>
        <p><b>Draining:</b> in-person points halve over the “see” aim (distance band’s invite goal × tier multiplier), messages over the tier’s contact goal, calls and video in between.</p>

        <table><tr><th>Tier</th><th>Contact</th><th>See multiplier</th></tr>${rows}</table>
        <table style="margin-top:10px"><tr><th>Distance</th><th>Invite goal</th></tr>${prox}</table>
        <p class="small muted" style="margin-top:8px">Change these numbers in your Rules sheet. Add a “See Multiplier” column there to tune the multipliers.</p></div>
      <button class="btn block" data-act="clear-cache">🧹 Clear saved data on this device</button>
      <p class="small muted" style="text-align:center;margin-top:14px">App version ${CLIENT_VERSION} · sheet code ${esc(S.data.version || 'old')}
        ${S.data.timings ? ` · last load read your sheet in ${(S.data.timings.total / 1000).toFixed(1)} s` : ''}</p>`;
  }

  /* ───────────── Map ───────────── */
  function friendPlace(f) {
    const options = [postalAddress(f), ...addresses(f)].filter(Boolean).map(q => ({ q, fromTag: false }))
      .concat(splitTags(f.placetags).map(q => ({ q, fromTag: true })));
    for (const o of options) {
      const g = S.geo[o.q.toLowerCase()];
      if (g) return { ...o, ...g };
      if (g === undefined) return { ...o, missing: true };
    }
    return null;
  }
  function distanceKm(a, b) {
    const R = 6371, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function mapStatus(text) { const el = $('#mapStatus'); el.hidden = !text; el.textContent = text || ''; }

  function renderMap() {
    if (!window.L) { mapStatus('Map couldn’t load. Check your connection.'); return; }
    if (!S.map) {
      S.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([54.2, -2.5], 5);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap contributors'
      }).addTo(S.map);
      S.layer = L.layerGroup().addTo(S.map);
      // Leaflet keeps clicks inside popups to itself, so wire the names up directly.
      S.map.on('popupopen', e => e.popup.getElement().querySelectorAll('[data-open]').forEach(el => {
        el.onclick = () => openSheet('friend', { row: +el.dataset.open });
      }));
    }
    setTimeout(() => S.map.invalidateSize(), 50);
    drawPins();
    geocodeMissing();
  }

  function drawPins(fit) {
    if (!S.map) return;
    S.layer.clearLayers();
    const groups = {};
    S.friends.forEach(f => {
      const p = friendPlace(f);
      f.$.dist = null;
      if (!p || p.missing) return;
      if (S.here) f.$.dist = distanceKm(S.here, p);
      const k = p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
      (groups[k] = groups[k] || { p, list: [] }).list.push(f);
    });
    const pts = [];
    Object.values(groups).forEach(({ p, list }) => {
      const one = list.length === 1;
      const size = one ? 38 : 40;
      const html = one
        ? `<div class="pin" style="width:${size}px;height:${size}px;background:${tierColor(list[0].$.tier)}">${esc(initials(list[0].name))}</div>`
        : `<div class="pin group" style="width:${size}px;height:${size}px">${list.length}</div>`;
      const icon = L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
      const popup = `<div style="font-weight:800;margin-bottom:4px">📍 ${esc(p.q)}</div>` + list.sort(SORTS.tier[1]).map(f =>
        `<div class="popup-row" data-open="${f._row}"><span class="tier-dot" style="background:${tierColor(f.$.tier)}"></span>${esc(f.name)}</div>`).join('');
      L.marker([p.lat, p.lng], { icon }).bindPopup(popup).addTo(S.layer);
      pts.push([p.lat, p.lng]);
    });
    (S.prefs.bases || []).filter(b => b.lat != null).forEach(b => {
      L.marker([b.lat, b.lng], { icon: L.divIcon({ className: '', html: `<div class="pin me" style="width:40px;height:40px;${b.name === S.prefs.current ? '' : 'opacity:.6'}">🏠</div>`, iconSize: [40, 40], iconAnchor: [20, 20] }) })
        .bindPopup(`<b>🏠 ${esc(b.name)}</b>${b.name === S.prefs.current ? '<br>Living here now' : ''}`).addTo(S.layer);
    });
    if (S.here) {
      L.circle([S.here.lat, S.here.lng], { radius: +$('#radius').value * 1000, color: '#ff6b4a', weight: 2, fillOpacity: .08 }).addTo(S.layer);
      L.marker([S.here.lat, S.here.lng], { icon: L.divIcon({ className: '', html: '<div class="pin me" style="width:40px;height:40px">⭐</div>', iconSize: [40, 40], iconAnchor: [20, 20] }) }).addTo(S.layer);
    }
    renderNearby();
    S.map.invalidateSize();
    if (fit === 'here' && S.here) S.map.fitBounds(L.latLng(S.here.lat, S.here.lng).toBounds(+$('#radius').value * 2200));
    else if (fit && pts.length) S.map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
  }

  function renderNearby() {
    const box = $('#nearby');
    if (!S.here) { box.hidden = true; return; }
    const r = +$('#radius').value;
    const list = S.friends.filter(f => f.$.dist != null && f.$.dist <= r).sort((a, b) => a.$.dist - b.$.dist);
    box.hidden = false;
    $('#nearbyList').innerHTML = `<div class="row" style="margin-bottom:8px"><div class="grow"><h3 style="font-size:16px">Near ${esc(S.here.label)}</h3>
      <div class="small muted">${plural(list.length, 'friend')} within ${r} km. Maybe say you’re around?</div></div>
      <button class="btn" style="padding:8px 12px" data-act="clear-here">✕</button></div>` +
      (list.length ? list.map(card).join('') : '<p class="muted small">Nobody nearby. Try a bigger distance.</p>');
  }

  async function geocodeMissing() {
    if (S.geocoding) return;
    S.geocoding = true;
    let first = true;
    try {
      for (let round = 0; round < 20; round++) {
        const missing = [...new Set(S.friends.map(friendPlace).filter(p => p && p.missing).map(p => p.q))];
        if (!missing.length) break;
        mapStatus(`📍 Finding ${plural(missing.length, 'place')}…`);
        const batch = missing.slice(0, 20);
        const res = JSON.parse(await api('geocode', JSON.stringify(batch)));
        batch.forEach(q => { const k = q.toLowerCase().trim(); if (!(k in res)) res[k] = null; });
        Object.assign(S.geo, res);
        recomputeAll(); render();
        drawPins(first); first = false;
      }
    } catch (e) { toast('⚠️ Map lookup: ' + e.message); }
    mapStatus('');
    S.geocoding = false;
    if (first) drawPins(true);
  }

  async function goToPlace(q) {
    q = q.trim();
    if (!q) return;
    mapStatus('🔎 Looking up ' + q + '…');
    try {
      const res = JSON.parse(await api('geocode', JSON.stringify([q])));
      const g = res[q.toLowerCase()];
      Object.assign(S.geo, res);
      if (!g) { toast('Couldn’t find “' + q + '”'); return; }
      S.here = { ...g, label: q };
      drawPins('here');
    } catch (e) { toast('⚠️ ' + e.message); }
    finally { mapStatus(''); }
  }

  function locateMe() {
    if (!navigator.geolocation) return toast('Location isn’t available here. Type a place instead.');
    mapStatus('📍 Finding you…');
    navigator.geolocation.getCurrentPosition(pos => {
      mapStatus('');
      S.here = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'you' };
      drawPins('here');
    }, () => {
      mapStatus('');
      toast('Google’s app frame blocked location. Type where you are instead 👆');
      $('#placeInput').focus();
    }, { timeout: 10000 });
  }

  /* ───────────── Fun ───────────── */
  function toast(text, opts = {}) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>${esc(text)}</span>${opts.undo ? '<button>Undo</button>' : ''}`;
    if (opts.undo) el.querySelector('button').onclick = () => { el.remove(); opts.undo(); };
    $('#toast').appendChild(el);
    setTimeout(() => el.remove(), opts.undo ? 6000 : 3800);
  }
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const bits = ['🎉', '✨', '💖', '🥳', '🌟', '🎈'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = bits[i % bits.length];
      s.style.left = '50vw'; s.style.top = '55vh';
      s.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px');
      s.style.setProperty('--dy', (-Math.random() * 380 - 60) + 'px');
      s.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  /* ───────────── Events ───────────── */
  const rowOf = el => S.byRow[el.dataset.row];

  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; if (S.sheet) closeSheet(); window.scrollTo(0, 0); render(); return; }
    const a = e.target.closest('[data-act]');
    if (!a) {
      const open = e.target.closest('[data-open]');
      if (open && !e.target.closest('a,input,select,textarea')) openSheet('friend', { row: +open.dataset.open });
      return;
    }
    if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
    const f = a.dataset.row ? rowOf(a) : null;
    const v = a.dataset.v;
    switch (a.dataset.act) {
      case 'refresh': refresh(); break;
      case 'retry': $('#view').innerHTML = '<div class="loading"><div class="big">🫶</div>Trying again…<div class="small" id="loadHint"></div></div>'; refresh(); break;
      case 'snooze': {
        const evs = addEvents([{ name: f.name, type: 'snooze' }]);
        toast(`💤 ${f.name.split(' ')[0]} will come back in ${SNOOZE_DAYS} days`, { undo: () => removeEventsLocal(evs) });
        break;
      }
      case 'more-checks': S.showAllChecks = true; render(); break;
      case 'more-due': S.showAllDue = true; render(); break;
      case 'game-toggle': savePrefs({ game: !gameOn() }); break;
      case 'reminders-on':
        api('setReminders', true).then(r => { S.data.remindersOn = r; render(); toast('📬 Monday emails on'); }).catch(err => toast('⚠️ ' + err.message));
        break;
      case 'reminders-hide': savePrefs({ remindersPromptHidden: true }); break;
      case 'quick': openSheet('quick'); setTimeout(() => { const t = $('#quickText'); t && t.focus(); }, 300); break;
      case 'quick-day': S.quick.day = v; renderSheetKeepingInputs(); break;
      case 'quick-tap': {
        const day = S.quick ? S.quick.day : iso(today());
        a.innerHTML = '<span class="e">✓</span>'; a.disabled = true;
        logMany([{ f, type: a.dataset.type, date: day }], `${TYPE_EMOJI[a.dataset.type]} ${f.name.split(' ')[0]} ·`);
        break;
      }
      case 'ql-type': { const e = S.quick.parsed[+a.dataset.i]; e.type = TYPE_ORDER[(TYPE_ORDER.indexOf(e.type) + 1) % TYPE_ORDER.length]; $('#quickPreview').innerHTML = quickPreview(); break; }
      case 'ql-who': { const e = S.quick.parsed[+a.dataset.i]; e.pick = (e.pick + 1) % e.cands.length; $('#quickPreview').innerHTML = quickPreview(); break; }
      case 'ql-date': { const e = S.quick.parsed[+a.dataset.i]; const n = daysBetween(parseDate(e.date), today()); e.date = iso(addDays(today(), -((n + 1) % 7))); $('#quickPreview').innerHTML = quickPreview(); break; }
      case 'ql-remove': S.quick.parsed.splice(+a.dataset.i, 1); $('#quickPreview').innerHTML = quickPreview(); break;
      case 'ql-save': {
        const entries = S.quick.parsed.map(e => ({ f: e.cands[e.pick], type: e.type, date: e.date }));
        S.quick = null; closeSheet();
        logMany(entries);
        break;
      }
      case 'plan-org': S.sheet.org = S.sheet.org === v ? '' : v; renderSheetKeepingInputs(); break;
      case 'auto-toggle': savePrefs({ autoConfirm: S.prefs.autoConfirm === false }); break;
      case 'auto-ok': ackAuto(v); render(); break;
      case 'auto-they': case 'auto-me': {
        const ev = S.log.find(e => e.id === v);
        if (f && ev) didntHappen(f, ev, a.dataset.act === 'auto-they' ? 'them' : 'me');
        break;
      }
      case 'bases': openSheet('bases'); break;
      case 'base-pick': savePrefs({ current: v }, v ? `🏠 Living in ${v}. Distances updated` : 'Using the distances in your sheet'); break;
      case 'base-remove': savePrefs({ bases: S.prefs.bases.filter(b => b.name !== v), current: S.prefs.current === v ? '' : S.prefs.current }); break;
      case 'auto-distance': savePrefs({ autoDistance: !S.prefs.autoDistance }); break;
      case 'base-add': addBase(); break;
      case 'toggle-place': S.openPlaces.has(v) ? S.openPlaces.delete(v) : S.openPlaces.add(v); render(); break;
      case 'invite': openSheet('invite', { place: v, size: 6, tag: '', what: 'Dinner', picked: null }); break;
      case 'inv-what': S.sheet.what = v; renderSheet(); break;
      case 'inv-toggle': S.sheet.picked.has(+a.dataset.row) ? S.sheet.picked.delete(+a.dataset.row) : S.sheet.picked.add(+a.dataset.row); rerenderInvite(); break;
      case 'inv-copy': copy([...S.sheet.picked].map(r => S.byRow[r] && S.byRow[r].name).filter(Boolean).join(', '), 'Names copied 📋'); break;
      case 'inv-done': markInvited([...S.sheet.picked].map(r => S.byRow[r]).filter(Boolean)); break;
      case 'settings': openSheet('settings'); break;
      case 'add': openSheet('add', { tier: null }); setTimeout(() => $('#addName') && $('#addName').focus(), 300); break;
      case 'close': closeSheet(); break;
      case 'browse': openSheet('browse'); break;
      case 'log': if (f) logInteraction(f, a.dataset.type); break;
      case 'log-past': if (f && $('#pastDate').value) logInteraction(f, $('#pastType').value, $('#pastDate').value); break;
      case 'book': if (f) openSheet('book', { row: f._row }); break;
      case 'plan-idea': $('#planWhat').value = v; break;
      case 'plan-save': {
        const what = $('#planWhat').value.trim() || 'Plans', when = $('#planDate').value;
        const sheetState = S.sheet;
        closeSheet(); S.sheet = null; vibrate();
        const org = sheetState && sheetState.org;
        const evs = [{ name: f.name, type: 'booked', note: org ? 'org:' + org : '' }];
        if (org === 'them') evs.push({ name: f.name, type: 'invited_me' });
        if (f.$.rel.pendingInvite) evs.push({ name: f.name, type: 'invite_yes' });
        save(f, { nextplan: what, nextplandate: when }).then(() => {
          addEvents(evs);
          toast(`📅 Plan: ${what}${when ? ' · ' + fmtDate(parseDate(when)) : ''}${xpText(XP.booked)}`);
        }).catch(() => {});
        break;
      }
      case 'plan-yes': {
        const when = f.$.planDate && f.$.planDays <= 0 ? iso(f.$.planDate) : iso(today());
        logInteraction(f, /video|call|zoom|facetime|teams/i.test(f.nextplan || '') ? 'video' : 'meet', when, [{ name: f.name, type: 'happened', date: when }]);
        if (f.$.hasPlan) save(f, { nextplan: '', nextplandate: '' }).catch(() => {});
        break;
      }
      case 'plan-they': case 'plan-me': {
        const they = a.dataset.act === 'plan-they';
        save(f, { nextplan: '', nextplandate: '' }).then(prev => {
          const evs = addEvents([{ name: f.name, type: they ? 'they_cancelled' : 'i_cancelled' }]);
          toast(they ? `Noted: ${f.name.split(' ')[0]} cancelled` : 'Plan cleared', { undo: () => { save(f, prev).catch(() => {}); removeEventsLocal(evs); } });
        }).catch(() => {});
        break;
      }
      case 'inv-reply': {
        if (v === 'yes') { openSheet('book', { row: f._row }); break; }
        const evs = addEvents([{ name: f.name, type: v === 'declined' ? 'invite_declined' : 'invite_noreply' }]);
        toast(v === 'declined' ? 'Noted: they said no this time' : 'Noted: no reply', { undo: () => removeEventsLocal(evs) });
        break;
      }
      case 'tier-move': {
        const from = f.$.tier;
        save(f, { tier: v }).then(prev => {
          const evs = addEvents([{ name: f.name, type: +v > from ? 'tier_down' : 'tier_up', note: `${from}→${v}` }]);
          toast(`🎚️ ${f.name.split(' ')[0]} is now tier ${v}`, { undo: () => { save(f, prev).catch(() => {}); removeEventsLocal(evs); } });
        }).catch(() => {});
        break;
      }
      case 'tier-keep': addEvents([{ name: f.name, type: 'tier_keep' }]); toast('👍 Keeping them where they are'); break;
      case 'progress': openSheet('progress'); break;
      case 'plan-no': {
        if (S.sheet && S.sheet.kind === 'book') closeSheet();
        save(f, { nextplan: '', nextplandate: '' }).then(prev => toast('Plan cleared', { undo: () => save(f, prev) })).catch(() => {});
        break;
      }
      case 'today-filter': S.todayFilter = v; render(); break;
      case 'tier-filter': S.tiers.has(+v) ? S.tiers.delete(+v) : S.tiers.add(+v); render(); break;
      case 'status-filter': S.status = S.status === v ? '' : v; render(); break;
      case 'clear-filters': S.query = ''; S.tiers.clear(); S.status = ''; render(); break;
      case 'search-for': S.query = v; S.tab = 'friends'; closeSheet(); render(); break;
      case 'dates-view': S.datesView = v; render(); break;
      case 'set-tier': save(f, { tier: v }).catch(() => {}); break;
      case 'toggle-card': save(f, { christmascard: isYes(f.christmascard) ? 'No' : 'Yes' }).catch(() => {}); break;
      case 'tag-remove': {
        const key = a.dataset.key, tags = splitTags(f[key]);
        tags.splice(+a.dataset.i, 1);
        save(f, { [key]: tags.join(', ') }).catch(() => {});
        break;
      }
      case 'copy': copy(a.dataset.text, 'Address copied 📋'); break;
      case 'copy-addresses': {
        const list = S.friends.filter(x => isYes(x.christmascard) && postalAddress(x)).sort(SORTS.name[1]);
        copy(list.map(x => x.name + '\n' + postalAddress(x)).join('\n\n'), `Copied ${plural(list.length, 'address')} 📋`);
        break;
      }
      case 'reminders': {
        const on = !S.data.remindersOn;
        a.classList.toggle('on', on);
        api('setReminders', on).then(r => { S.data.remindersOn = r; render(); renderSheet(); toast(r ? '📬 Reminders on' : 'Reminders off'); })
          .catch(err => { a.classList.toggle('on', !on); toast('⚠️ ' + err.message); });
        break;
      }
      case 'email-xmas': toast('📧 Sending…'); api('emailChristmasList').then(r => toast('🎄 ' + r)).catch(err => toast('⚠️ ' + err.message)); break;
      case 'email-bdays': toast('📧 Sending…'); api('emailWeeklyNudge', false).then(r => toast('🫶 ' + r)).catch(err => toast('⚠️ ' + err.message)); break;
      case 'add-tier': S.sheet.tier = +v; renderSheetKeepingInputs(); break;
      case 'add-save': submitNewFriend(); break;
      case 'locate': locateMe(); break;
      case 'clear-here': S.here = null; drawPins(); break;
      case 'clear-cache': try { localStorage.removeItem(CACHE_KEY); } catch (err) {} toast('Cleared. Reloading data…'); closeSheet(); refresh(); break;
    }
  });

  // Text fields in the friend page save when you leave them.
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.save) {
      const f = rowOf(el);
      if (f && String(f[el.dataset.save] ?? '') !== el.value) save(f, { [el.dataset.save]: el.value }, { quiet: el.tagName !== 'SELECT' }).then(() => toast('✓ Saved')).catch(() => {});
    } else if (el.id === 'sortSelect') { S.sort = el.value; render(); }
    else if (['invPlace', 'invSize', 'invTag'].includes(el.id)) {
      S.sheet.place = $('#invPlace').value; S.sheet.size = +$('#invSize').value; S.sheet.tag = $('#invTag').value;
      S.sheet.picked = null; renderSheet();
    }
    else if (el.id === 'radius') drawPins('here');
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'quickText') {
      S.quick.text = e.target.value;
      S.quick.parsed = parseQuickLog(e.target.value);
      $('#quickPreview').innerHTML = quickPreview();

      S.quick.filter = e.target.value;
      const panel = $('#sheetPanel'), top = panel.scrollTop;
      renderSheetKeepingInputs();
      panel.scrollTop = top;
      const el = $('#quickFilter'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    }
    if (e.target.id === 'searchInput') {
      S.query = e.target.value;
      $('#friendList').innerHTML = (() => { const l = filteredFriends(); return l.length ? l.map(card).join('') : emptyState('🔍', 'No matches', 'Try a different word, or tap 🏷️ to see every tag.'); })();
    }
  });

  // Remember which friend-page sections are open, so saving a field doesn't fold them away.
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d.dataset && d.dataset.box) d.open ? S.openBoxes.add(d.dataset.box) : S.openBoxes.delete(d.dataset.box);
  }, true);

  // Chart bars: show the week's value on hover, focus or tap.
  ['pointerover', 'focusin', 'click'].forEach(t => document.addEventListener(t, e => {
    const bar = e.target.closest && e.target.closest('[data-tip]');
    const tip = $('#chartTip');
    if (bar && tip) tip.textContent = bar.dataset.tip;
  }));

  document.addEventListener('keydown', e => {
    const el = e.target;
    if (el.dataset && el.dataset.tagAdd && (e.key === 'Enter' || e.key === ',')) {
      e.preventDefault();
      addTag(el);
    } else if (el.id === 'placeInput' && e.key === 'Enter') { el.blur(); goToPlace(el.value); }
    else if (e.key === 'Escape' && S.sheet) closeSheet();
  });
  // Picking a suggestion from the tag list adds it straight away.
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.tagAdd && e.inputType === 'insertReplacementText') addTag(el);
  });
  document.addEventListener('focusout', e => { const el = e.target; if (el.dataset && el.dataset.tagAdd && el.value.trim()) addTag(el); });

  function addTag(el) {
    const f = rowOf(el), key = el.dataset.tagAdd, t = el.value.replace(/,/g, '').trim();
    el.value = '';
    if (!f || !t) return;
    const tags = splitTags(f[key]);
    if (tags.some(x => x.toLowerCase() === t.toLowerCase())) return;
    save(f, { [key]: [...tags, t].join(', ') }).then(() => { const next = $(`[data-tag-add="${key}"]`); next && next.focus(); }).catch(() => {});
  }

  function copy(text, msg) {
    const done = () => toast(msg);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback() {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Couldn’t copy'); }
      t.remove();
    }
  }

  function rerenderInvite() { const panel = $('#sheetPanel'), top = panel.scrollTop; renderSheet(); panel.scrollTop = top; }

  async function addBase() {
    const name = $('#baseName').value.trim(), query = $('#baseQuery').value.trim() || name;
    if (!name) { toast('Give it a name, like “London”'); return; }
    const btn = document.querySelector('[data-act="base-add"]');
    btn.disabled = true; btn.textContent = 'Finding it…';
    try {
      const res = JSON.parse(await api('geocode', JSON.stringify([query])));
      const g = res[query.toLowerCase()];
      Object.assign(S.geo, res);
      if (!g) throw new Error(`Couldn’t find “${query}”. Try a postcode.`);
      const bases = (S.prefs.bases || []).filter(b => b.name !== name).concat([{ name, query, lat: g.lat, lng: g.lng, country: g.country || '' }]);
      savePrefs({ bases, current: name }, `🏠 Living in ${name}. Distances updated`);
    } catch (e) { toast('⚠️ ' + e.message); btn.disabled = false; btn.textContent = 'Add & live here'; }
  }

  function markInvited(list) {
    if (!list.length) return;
    const day = iso(today());
    const updates = list.map(f => {
      const changes = { lastinvited: day };
      const last = parseDate(f.lastcontacted);
      if (!last || last.noYear || iso(last) < day) changes.lastcontacted = day;
      const prev = {}; Object.keys(changes).forEach(k => { prev[k] = f[k] ?? ''; });
      Object.assign(f, changes); compute(f);
      return { f, row: f._row, name: f.name, changes, prev };
    });
    closeSheet(); render(); confetti(); vibrate();
    const send = key => write('updateMany', JSON.stringify(updates.map(u => ({ row: u.row, name: u.name, changes: u[key] }))));
    const evs = addEvents(list.map(f => ({ name: f.name, type: 'invite', note: f.$.tier ? 't' + f.$.tier : '' })));
    send('changes').then(() => toast(`💌 Marked ${plural(list.length, 'friend')} as invited${xpText(list.length * XP.invite)}`, {
      undo: () => { updates.forEach(u => { Object.assign(u.f, u.prev); compute(u.f); }); removeEventsLocal(evs); render(); send('prev').catch(err => toast('⚠️ ' + err.message)); }
    })).catch(err => { updates.forEach(u => { Object.assign(u.f, u.prev); compute(u.f); }); render(); toast('⚠️ ' + err.message); });
  }

  function renderSheetKeepingInputs() {
    const vals = {};
    document.querySelectorAll('#sheetPanel input[id], #sheetPanel select[id], #sheetPanel textarea[id]').forEach(i => { vals[i.id] = i.value; });
    renderSheet();
    Object.entries(vals).forEach(([id, v]) => { const i = $('#' + id); if (i) i.value = v; });
  }

  function submitNewFriend() {
    const name = $('#addName').value.trim();
    if (!name) { toast('A name is needed'); $('#addName').focus(); return; }
    const fields = {
      name, tier: S.sheet.tier ? String(S.sheet.tier) : '', proximityscore: $('#addProx').value,
      meeting: $('#addMeeting').value.trim(), tags: $('#addTags').value.trim(), placetags: $('#addPlaces').value.trim(),
      birthdaydate: $('#addBday').value, phone: $('#addPhone').value.trim(), address: $('#addAddress').value.trim(),
      lastcontacted: iso(today())
    };
    Object.keys(fields).forEach(k => { if (!fields[k] || (!S.cols[k] && !S.data.extraColumns[k])) delete fields[k]; });
    const btn = document.querySelector('[data-act="add-save"]');
    btn.disabled = true; btn.textContent = 'Adding…';
    write('addFriend', JSON.stringify(fields)).then(r => {
      closeSheet(); confetti(); toast(`🌱 Added ${name}`);
      return refresh().then(() => { if (S.byRow[r.row]) openSheet('friend', { row: r.row }); });
    }).catch(err => { btn.disabled = false; btn.textContent = 'Add friend 🎉'; toast('⚠️ ' + err.message); });
  }

  // Shown instead of an endless spinner when the first load fails.
  function showLoadError(message) {
    $('#view').innerHTML = `<div class="empty"><div class="big">😕</div><h3>Couldn’t load your friends</h3>
      <div class="box" style="text-align:left;margin:14px 0"><b>Google said:</b> ${esc(message)}</div>
      <button class="btn primary" data-act="retry">Try again</button>
      <div class="small" style="text-align:left;margin-top:16px">
        <p><b>Things to check</b></p>
        <p>1. In Apps Script, both <b>Code.gs</b> and <b>Index.html</b> have the new code and are saved.</p>
        <p>2. <b>Deploy → Manage deployments → ✏️ → Version: New version → Deploy</b>.</p>
        <p>3. In Apps Script, choose <b>checkSetup</b> next to ▶ Run and press Run. The Execution log says what’s wrong.</p></div></div>`;
  }

  /* ───────────── Start ───────────── */
  (function init() {
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) { const d = JSON.parse(cached); if (!d.error) ingest(d); }
    } catch (e) {}
    render();
    refresh();
    // Keep you posted if Google is slow, rather than leaving a silent spinner.
    setTimeout(() => { if (!S.data && $('#loadHint')) $('#loadHint').textContent = 'Still loading… The first load after an update can take 20–30 seconds while Google starts the app.'; }, 8000);
    setTimeout(() => { if (!S.data && $('#loadHint')) showLoadError('No reply from Google after a minute.'); }, 60000);
  })();
  </script>
</body>
</html>
